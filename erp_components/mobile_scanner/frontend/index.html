<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>
        Mobile Barcode Scanner
    </title>

    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
        }


        video {

            width: 100%;
            border-radius: 10px;

        }


        #result {

            margin-top: 10px;
            padding: 10px;
            font-size: 18px;
            text-align: center;

        }

    </style>

</head>


<body>


<video id="video"
       autoplay
       playsinline>
</video>


<div id="result">
    📷 Waiting scan...
</div>



<script>


const codeReader =
    new ZXing.BrowserMultiFormatReader();


const video =
    document.getElementById("video");


const resultBox =
    document.getElementById("result");


let scanned = false;



async function startScanner(){


    try {


        const devices =
            await codeReader.listVideoInputDevices();



        if(devices.length === 0){


            resultBox.innerHTML =
                "❌ No camera found";


            return;

        }



        let cameraId =
            devices[devices.length - 1].deviceId;



        // Prefer rear camera

        for(const device of devices){


            const label =
                (device.label || "")
                .toLowerCase();



            if(
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment")
            ){

                cameraId =
                    device.deviceId;

            }

        }



        codeReader.decodeFromVideoDevice(

            cameraId,

            video,


            (result, error)=>{


                if(result && !scanned){


                    scanned = true;


                    const barcode =
                        result.text;



                    resultBox.innerHTML =
                        "✅ " + barcode;



                    // Send barcode to Streamlit

                    window.parent.postMessage(

                    {

                        type:
                        "streamlit:setComponentValue",

                        value:
                        barcode

                    },

                    "*"

                    );



                    setTimeout(()=>{


                        codeReader.reset();


                    },500);



                }


            }

        );


    }

    catch(e){


        resultBox.innerHTML =
            "❌ Camera Error: " + e;


    }


}



startScanner();



</script>


</body>

</html>
