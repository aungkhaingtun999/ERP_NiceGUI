# .github/workflows/deploy.yml
name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull
      
      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
      
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub
          
          # Clone HF Space with token
          git clone https://aungkhaingtun:$HF_TOKEN@huggingface.co/spaces/aungkhaingtun/NiceGUI hf-space
          
          # Copy files
          rsync -av --exclude='.git' --exclude='.github' --exclude='hf-space' ./ hf-space/
          
          # Push to HF
          cd hf-space
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Deploy from GitHub" || echo "No changes"
          git push https://aungkhaingtun:$HF_TOKEN@huggingface.co/spaces/aungkhaingtun/NiceGUI main
