# .github/workflows/deploy.yml
name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true
      
      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull
      
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub
          huggingface-cli login --token $HF_TOKEN
          
          # Clone HF Space
          git clone https://huggingface.co/spaces/aungkhaingtun/NiceGUI hf-space
          
          # Copy files
          rsync -av --exclude='.git' --exclude='hf-space' ./ hf-space/
          
          # Push to HF
          cd hf-space
          git add .
          git commit -m "Deploy from GitHub" || echo "No changes"
          git push
